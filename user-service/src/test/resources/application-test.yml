spring:

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

    database-platform: org.hibernate.dialect.H2Dialect

  cloud:
    discovery:
      enabled: false

eureka:

  client:
    enabled: false

jwt:

  secret: test-secret-key-must-be-at-least-32-characters-long-123

  expiration: 3600000
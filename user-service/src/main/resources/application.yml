server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  application:
    name: USER-SERVICE

  datasource:
    url: ${USER_DB_URL:jdbc:mysql://localhost:3306/starlight_user_db}
    username: ${USER_DB_USERNAME:root}
    password: ${USER_DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:starlight-hospitality-secret-key-must-be-at-least-32-characters-long}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

# ===============================
# Application Identity
# ===============================
spring.application.name=ROOM-SERVICE
server.port=${ROOM_SERVICE_PORT:8082}

# ===============================
# MySQL Datasource
# ===============================
spring.datasource.url=${ROOM_DB_URL:jdbc:mysql://localhost:3306/starlight_room_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${ROOM_DB_USERNAME:root}
spring.datasource.password=${ROOM_DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Eureka Client
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# Jackson - date handling for LocalDate
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
